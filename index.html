<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Collection Desk – Cartrend</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#EDF1F4; --surface:#FFFFFF; --surface-2:#F4F6F9; --ink:#17223A; --muted:#5B687D; --faint:#8A95A6;
  --line:#D5DCE5; --line-2:#E7ECF1; --accent:#5A3FC0; --accent-soft:#ECE8FB; --on-accent:#FFFFFF;
  --b0:#2B8A78; --b1:#74A436; --b2:#D99A1E; --b3:#DB6727; --b4:#C42F3A; --empty:#E3E8EE;
  --good:#1F8A4C; --bad:#C42F3A; --warn:#A86A12;
  --shadow:0 1px 0 rgba(23,34,58,.04),0 10px 28px -16px rgba(23,34,58,.22);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F141D; --surface:#161D29; --surface-2:#1B2331; --ink:#E5EAF1; --muted:#9BA6B7; --faint:#6F7B8E;
    --line:#2A3445; --line-2:#222B3A; --accent:#A08BF3; --accent-soft:#2A2448; --on-accent:#140F2A;
    --b0:#3AAE97; --b1:#8CC04C; --b2:#E9AE35; --b3:#EE8143; --b4:#E5535D; --empty:#252F3F;
    --good:#4CC27D; --bad:#E5535D; --warn:#E3A847;
    --shadow:0 1px 0 rgba(0,0,0,.2),0 12px 30px -18px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F141D; --surface:#161D29; --surface-2:#1B2331; --ink:#E5EAF1; --muted:#9BA6B7; --faint:#6F7B8E;
  --line:#2A3445; --line-2:#222B3A; --accent:#A08BF3; --accent-soft:#2A2448; --on-accent:#140F2A;
  --b0:#3AAE97; --b1:#8CC04C; --b2:#E9AE35; --b3:#EE8143; --b4:#E5535D; --empty:#252F3F;
  --good:#4CC27D; --bad:#E5535D; --warn:#E3A847;
  --shadow:0 1px 0 rgba(0,0,0,.2),0 12px 30px -18px rgba(0,0,0,.6);
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1480px;margin:0 auto;padding:22px clamp(12px,3vw,30px) 56px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 24px;margin-bottom:18px}
.brand h1{margin:0;font-size:clamp(24px,3.2vw,34px);font-weight:800;letter-spacing:-.02em;line-height:1.05}
.brand p{margin:6px 0 0;color:var(--muted);font-size:13.5px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 14px;font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.small{padding:6px 10px;font-size:12.5px;border-radius:7px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn[disabled]{opacity:.5;cursor:not-allowed}

.banner{border:1px dashed var(--accent);background:var(--accent-soft);border-radius:10px;padding:10px 14px;margin-bottom:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;font-size:13.5px}

/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.card{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px 13px;box-shadow:var(--shadow);position:relative;transition:border-color .15s}
.card:hover{border-color:var(--faint)}
.card[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset,var(--shadow)}
.card .n{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.1;display:block}
.card .l{font-size:13px;font-weight:600;display:block;margin-top:2px}
.card .a{font-size:12.5px;color:var(--muted);display:block;margin-top:3px}
.card .dot{position:absolute;top:13px;right:13px;width:9px;height:9px;border-radius:50%;background:var(--c,var(--faint))}

/* tabs + filters */
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:10px}
.tabs{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.tabs button{border:0;background:none;padding:7px 13px;border-radius:7px;font-weight:600;font-size:13.5px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.filters input,.filters select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;font-size:13.5px;min-width:0}
.filters input{width:min(260px,100%)}
.count{color:var(--muted);font-size:13px;margin:0 0 8px}

/* table */
.tablebox{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:1240px}
th,td{padding:9px 10px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line-2)}
thead th{font-size:12px;font-weight:700;color:var(--muted);background:var(--surface-2);white-space:nowrap;border-bottom:1px solid var(--line)}
thead tr.grp th{border-bottom:0;padding-bottom:2px}
thead th.remhead{text-align:center;color:var(--ink);font-size:12.5px;border-bottom:1px solid var(--line);border-left:1px solid var(--line);border-right:1px solid var(--line)}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--ink)}
th .ar{opacity:.7;margin-left:3px}
td.num,th.num{text-align:right;white-space:nowrap}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
td.rem{border-left:1px solid var(--line-2);width:170px;max-width:170px}
td.rem + td.rem{border-left:1px dashed var(--line-2)}
.rem .t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13px}
.rem .d{font-size:11.5px;color:var(--faint)}
.cname{font-weight:600}
.sub{display:block;font-size:12px;color:var(--muted);font-weight:400}
.due{font-weight:700}
.neg{color:var(--good)}
.over{color:var(--bad);font-weight:600}
.flag{display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;border-radius:5px;margin:3px 4px 0 0;background:color-mix(in srgb,var(--bad) 13%,transparent);color:var(--bad)}
.flag.v{background:var(--accent-soft);color:var(--accent)}
.flag.g{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good)}

/* the age strip */
.strip{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;width:150px;height:20px}
.strip i{border-radius:3px;background:var(--empty);position:relative}
.strip i.on{background:var(--c)}
.strip-legend{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;width:150px;font-size:10px;letter-spacing:-.02em;color:var(--faint);font-weight:600;text-align:center}

/* chips */
.chip{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;border:1.5px solid color-mix(in srgb,var(--c) 60%,transparent);color:var(--c);background:color-mix(in srgb,var(--c) 9%,transparent);white-space:nowrap}
.chip.none{--c:var(--faint);border-style:dashed;font-weight:600}
.next{white-space:nowrap;font-size:13px}
.next.late{color:var(--bad);font-weight:700}
.next.today{color:var(--accent);font-weight:700}

/* empty */
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:44px 22px;text-align:center}
.empty h2{margin:0 0 6px;font-size:22px;letter-spacing:-.01em}
.empty p{margin:0 auto 18px;color:var(--muted);max-width:56ch}
.empty .actions{justify-content:center}

/* drawer + modal */
.scrim{position:fixed;inset:0;background:rgba(10,14,22,.42);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(600px,100%);background:var(--bg);z-index:50;transform:translateX(102%);transition:transform .22s ease;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);border-left:1px solid var(--line)}
.drawer.on{transform:none}
@media (prefers-reduced-motion:reduce){.drawer,.scrim{transition:none}}
.dhead{padding:16px 20px 12px;background:var(--surface);border-bottom:1px solid var(--line)}
.dhead h2{margin:0;font-size:20px;letter-spacing:-.01em;padding-right:40px}
.dclose{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:14px;width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:18px;line-height:1}
.dbody{overflow-y:auto;padding:16px 20px 30px;flex:1}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 4px}
.kv div{background:var(--surface-2);border-radius:9px;padding:8px 10px}
.kv b{display:block;font-size:16px}
.kv span{font-size:12px;color:var(--muted)}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.sec h3{margin:0 0 10px;font-size:14.5px}
.bk{display:grid;grid-template-columns:52px 1fr 90px;gap:8px;align-items:center;font-size:13px;margin-bottom:5px}
.bk .bar2{height:10px;border-radius:5px;background:var(--empty);overflow:hidden}
.bk .bar2 i{display:block;height:100%;background:var(--c)}
.mini{width:100%;border-collapse:collapse;min-width:0}
.mini td,.mini th{padding:5px 4px;font-size:12.5px;border-bottom:1px solid var(--line-2)}
.mini th{background:none;color:var(--muted)}
.field{display:block;margin-bottom:11px}
.field > span{display:block;font-size:12.5px;font-weight:700;margin-bottom:5px}
.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;font-size:13.5px}
.field textarea{min-height:58px;resize:vertical}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.statuses{display:flex;flex-wrap:wrap;gap:6px}
.statuses label{position:relative}
.statuses input{position:absolute;opacity:0;pointer-events:none}
.statuses span{display:inline-block;padding:5px 10px;border-radius:7px;border:1.5px solid var(--line);font-size:12.5px;font-weight:600;cursor:pointer;background:var(--surface)}
.statuses input:checked + span{border-color:var(--c);color:var(--c);background:color-mix(in srgb,var(--c) 10%,transparent)}
.statuses input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.typebar{margin-bottom:12px;flex-wrap:wrap}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:12px;margin-bottom:12px}
.dsec{margin-bottom:0}
.dsec h3{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.dsec h3 small{font-size:12px;color:var(--muted);font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:10px}
.kpi{background:var(--surface-2);border-radius:9px;padding:8px 10px;text-align:left;border:1px solid transparent;display:block;width:100%}
button.kpi:hover{border-color:var(--faint)}
.kpi b{display:block;font-size:20px;font-weight:800;letter-spacing:-.01em;line-height:1.15}
.kpi span{display:block;font-size:12px;color:var(--muted);font-weight:600}
.kpi span.s2{font-weight:500}
.kpi.good b{color:var(--good)}.kpi.bad b{color:var(--bad)}.kpi.acc b{color:var(--accent)}
.prog{height:10px;border-radius:5px;background:var(--empty);overflow:hidden;margin:4px 0 4px}
.prog i{display:block;height:100%;background:var(--accent)}
.split{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--empty);margin:6px 0 6px}
.split i{display:block;height:100%}
.legend{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-bottom:8px}
.legend b{color:var(--ink)}
.dot2{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--c)}
.bks{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:8px}
.bk2{text-align:left;border:1px solid var(--line);border-left:5px solid var(--c);background:var(--surface);border-radius:10px;padding:9px 12px;display:block;width:100%}
.bk2:hover{border-color:var(--faint);border-left-color:var(--c)}
.bk2 .t{display:block;font-weight:700;font-size:13px}
.bk2 b{display:block;font-size:18px;letter-spacing:-.01em}
.bk2 span.s{display:block;font-size:12.5px;color:var(--muted)}
.bk2.plus{background:color-mix(in srgb,var(--c) 9%,var(--surface))}
.trend{display:flex;align-items:flex-end;gap:8px;height:130px;margin-top:6px}
.trend > div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;height:100%;min-width:0}
.trend .tb{width:100%;max-width:40px;display:flex;flex-direction:column;border-radius:4px 4px 0 0;overflow:hidden}
.trend .tb i{display:block;width:100%;min-height:0}
.trend small{font-size:10.5px;color:var(--faint);white-space:nowrap}
.trend small.v{color:var(--muted);font-weight:700}
.warnbox{background:color-mix(in srgb,var(--warn) 14%,transparent);border:1px solid color-mix(in srgb,var(--warn) 45%,transparent);border-radius:10px;padding:9px 13px;margin-bottom:12px;font-size:13.5px}
.cl{list-style:none;margin:0;padding:0}
.cl li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line-2);font-size:13.5px;align-items:center}
.cl li:last-child{border-bottom:0}
.cl button{border:0;background:none;padding:0;text-align:left;font-weight:600;color:var(--ink)}
.cl button:hover{text-decoration:underline}
.cl .sub{display:block}
.mp{margin:0 0 8px;color:var(--muted);font-size:13px}

.more{margin-top:8px}
.addr{margin:6px 0 0;font-size:13px;color:var(--ink);line-height:1.4;padding-right:40px}
.addr.none{color:var(--faint)}
.trkrow{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;padding:7px 0;border-bottom:1px dashed var(--line-2)}
.trkrow:last-child{border-bottom:0}
.trkrow .sub{display:block}
.tbtns{display:flex;gap:6px;flex-wrap:wrap}
#trkBox:empty{display:none}
.bigs{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-bottom:12px}
.big{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);display:block;width:100%;cursor:pointer}
.big:hover{border-color:var(--faint)}
.big b{display:block;font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.big .l{display:block;font-size:13px;font-weight:700;margin-top:3px}
.big .s3{display:block;font-size:12px;color:var(--muted);margin-top:5px}
.dlt{display:inline-block;font-size:12px;font-weight:700;margin-right:6px}
.dgood{color:var(--good)}.dbad{color:var(--bad)}
.okline{margin:8px 0 0;font-size:12.5px;color:var(--good);font-weight:600}
.alertbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:color-mix(in srgb,var(--bad) 8%,var(--surface));border:1px solid color-mix(in srgb,var(--bad) 40%,transparent);border-radius:12px;padding:9px 12px;margin-bottom:12px;font-size:13.5px}
.alertbar button{border:1px solid color-mix(in srgb,var(--bad) 50%,transparent);background:var(--surface);color:var(--bad);font-weight:700;border-radius:999px;padding:3px 11px;font-size:12.5px;cursor:pointer}
.alertbar button b{margin-right:4px}
.agebar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.ageseg{flex:var(--g) 1 92px;min-width:0;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px 9px;display:block;cursor:pointer;overflow:hidden}
.ageseg:hover{border-color:var(--faint)}
.ageseg i{display:block;height:8px;border-radius:4px;background:var(--c);margin-bottom:7px}
.ageseg .t{display:block;font-weight:700;font-size:12.5px}
.ageseg b{display:block;font-size:16px}
.ageseg .s{display:block;font-size:11.5px;color:var(--muted)}
.age3{display:flex;gap:8px;flex-wrap:wrap}
.tabs.trk{margin-bottom:10px;flex-wrap:wrap}
.tabs .badge{display:inline-block;min-width:18px;padding:0 6px;margin-left:5px;border-radius:9px;background:var(--surface-2);font-size:11.5px;font-weight:700;color:var(--ink);text-align:center}
.tabs button[aria-selected="true"] .badge{background:rgba(255,255,255,.22);color:var(--bg)}
.tabs .badge.bad{background:var(--bad);color:#fff}
.escon{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 6%,var(--surface))}
.eh{list-style:none;margin:8px 0;padding:0;font-size:12.5px;color:var(--muted)}
.eh li{padding:3px 0;border-bottom:1px dashed var(--line-2)}
#escBox:empty{display:none}
.chipbtn{border:1px solid transparent;background:none;padding:3px 6px;border-radius:8px;display:inline-flex;gap:5px;align-items:center;cursor:pointer;font-size:13px}
.chipbtn:hover{border-color:var(--faint);background:var(--surface-2)}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font:inherit;font-weight:700;text-decoration:underline;cursor:pointer}
/* desktop: docked panel, sticky header, compact */
tbody tr.sel td{background:var(--accent-soft)}
tbody tr{scroll-margin-top:70px}
.savebar{position:sticky;bottom:-14px;z-index:5;background:var(--surface);padding:10px 0 12px;margin:6px 0 -12px;border-top:1px solid var(--line-2);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.nxq{margin-top:-4px;margin-bottom:10px}
.nxq button{border-style:solid}
.nxl{display:block;font-size:12.5px;color:var(--accent);font-weight:700;min-height:18px;margin:-6px 0 8px}
@media (min-width:1100px){
  body.dock .wrap{max-width:none;margin:0;padding-right:calc(600px + 24px)}
  body.dock .scrim{display:none}
  body.dock .drawer{box-shadow:-10px 0 28px -14px rgba(10,14,22,.45)}
}
@media (min-width:900px){
  .tablebox{max-height:calc(100vh - 120px);overflow:auto}
  thead th{position:sticky;top:0;z-index:3}
  thead tr:nth-child(2) th{top:var(--h1,34px)}
}
body.dense th,body.dense td{padding:4px 8px}
body.dense{font-size:13px}
body.dense .rem .t{-webkit-line-clamp:1}
body.dense .strip{height:13px}
body.dense .flag{margin-top:1px}
body.dense #dens{border-color:var(--accent);color:var(--accent)}
.delta{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px;box-shadow:var(--shadow);font-size:13px}
.delta .dh{font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:8px}
.dls{display:flex;flex-wrap:wrap;gap:8px}
.dl{border:1px solid var(--line-2);background:var(--surface-2);border-radius:9px;padding:7px 12px;text-align:left;display:flex;flex-direction:column;min-width:140px}
.dl:hover{border-color:var(--faint)}
.dl[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.dl b{font-size:18px;font-weight:800;letter-spacing:-.01em}
.dl.good b{color:var(--good)}
.dl span{font-size:12.5px;font-weight:600}
.dl em{font-style:normal;font-size:12px;color:var(--muted)}
.qchips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}

<body>

  <header class="top">
    <div class="brand">
      <h1>Collection Desk</h1>
      <p id="subline">Cartrend Auto Parts – customer ageing aur payment follow-up</p>
    </div>
    <div class="actions" id="topActions"></div>
  </header>
  <div id="banner"></div>
  <div id="main"></div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dTitle">

    <div class="mfoot"><button class="btn" id="upCancel">Cancel</button><button class="btn primary" id="upGo" disabled>Process karke save karein</button></div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ============ constants ============ */
const DAY = 864e5;
const BUCKETS = ['0–15','16–30','31–60','61–90','90+'];
const BVARS = ['var(--b0)','var(--b1)','var(--b2)','var(--b3)','var(--b4)'];
const STATUSES = [
  {v:'Connected',        c:'#2B8A78', subs:['Call Back','Visit Raise','Credit Note','Dispute','Paid','Scheme Issue','Other Issue','Promise To Pay','Legal']},
  {v:'Not Answer',       c:'#6B7588', subs:['Call Back']},
  {v:'Wrong No',         c:'#DB6727', subs:['Wrong No']},
  {v:'Not Responded',    c:'#86629C', subs:['Visit Req']},
  {v:'Language Barrier', c:'#2F6FBF', subs:['Hindi','English','Tamil','Gujarati','Marathi','Other']}
];
const SCOL = Object.fromEntries(STATUSES.map(s=>[s.v,s.c]));
/* n = next follow-up din (null = date alag se, '' = koi nahi), w = follow-up kisse */
const SUBRULE = {
  'Connected|Call Back':{n:null,w:'Customer'}, 'Connected|Visit Raise':{n:2,w:'Agent'}, 'Connected|Credit Note':{n:2,w:'Accounts'},
  'Connected|Dispute':{n:3,w:'Customer'}, 'Connected|Paid':{n:'',w:'Customer'}, 'Connected|Scheme Issue':{n:3,w:'Accounts'},
  'Connected|Other Issue':{n:3,w:'Customer'}, 'Connected|Promise To Pay':{n:null,w:'Customer'}, 'Connected|Legal':{n:15,w:'Accounts'},
  'Not Answer|Call Back':{n:1,w:'Customer'}, 'Wrong No|Wrong No':{n:1,w:'Agent'}, 'Not Responded|Visit Req':{n:2,w:'Agent'},
  'Language Barrier|*':{n:2,w:'Customer'}
};
function subRule(st,ss){ return SUBRULE[st+'|'+ss]||SUBRULE[st+'|*']||{n:3,w:'Customer'}; }
/* purane logs (sirf status) ko naye format mein badalna – history nahi jaati */
const OLD_MAP = {'Not Answer':['Not Answer','Call Back'],'Connected':['Connected','Other Issue'],'Promise To Pay':['Connected','Promise To Pay'],'Credit Note':['Connected','Credit Note'],'Dispute':['Connected','Dispute'],'Paid':['Connected','Paid'],'Legal':['Connected','Legal'],'Visit Req':['Connected','Visit Raise'],'Wrong No':['Wrong No','Wrong No'],'Not Responded':['Not Responded','Visit Req']};
function normLog(l){ if(l.ss!=null) return l; const m=OLD_MAP[l.st]; return m?{...l,st:m[0],ss:m[1],_old:1}:{...l,ss:''}; }
function naStreak(logs){ let n=0; for(let i=logs.length-1;i>=0;i--){ if(logs[i].st==='Not Answer') n++; else break; } return n; }
const TRK = {
  visit:{label:'Visit', stages:[['pending','Visit Pending'],['raised','Raised'],['done','Visit Done']]},
  cn:{label:'Credit Note', stages:[['new','Naya'],['return','Return Raised'],['pickup','Pickup Done'],['done','CN Done']]}
};
function trkLabel(kind,st){ const x=TRK[kind].stages.find(s=>s[0]===st); return x?x[1]:st; }
function trkNext(kind,st){ const s=TRK[kind].stages, i=s.findIndex(x=>x[0]===st); return i>=0?(s[i+1]||null):null; }
function trkBtnsHTML(k,kind,st){
  const nx=trkNext(kind,st); if(!nx) return '';
  const last=TRK[kind].stages[TRK[kind].stages.length-1];
  let h=`<button class="btn small" type="button" data-act="trk" data-k="${esc(k)}" data-t="${kind}" data-s="${nx[0]}">→ ${nx[1]}</button>`;
  if(nx[0]!==last[0]) h+=`<button class="btn small ghost" type="button" data-act="trk" data-k="${esc(k)}" data-t="${kind}" data-s="done">${last[1]}</button>`;
  return h;
}
const WITHS = ['Customer','Agent','Accounts'];

const FIELDS = {
  bal: [
    {k:'name',  label:'Customer name', req:1, kw:['name','party name','customer name','ledger name','account name']},
    {k:'bal',   label:'Balance (Dr / Cr)', req:1, kw:['balance','closing balance','outstanding']},
    {k:'group', label:'Group (agent)', kw:['groupname','group name','group','agent']},
    {k:'mobile',label:'Mobile', kw:['mobile','mobile no']},
    {k:'phone', label:'Phone', kw:['phone','phone no','contact no']},
    {k:'person',label:'Contact person', kw:['person','contact person']},
    {k:'addr',  label:'Address', kw:['address','addr']},
    {k:'credit',label:'Credit days', kw:['credit days','credit period','cr days']}
  ],
  sales: [
    {k:'name',  label:'Customer name', req:1, kw:['customer name','party name','name','customer']},
    {k:'date',  label:'Invoice date', req:1, kw:['date','invoice date','bill date','inv date']},
    {k:'ref',   label:'Invoice no.', kw:['invoice no','bill no','inv no','voucher no','invoice']},
    {k:'amt',   label:'Invoice amount', req:1, kw:['amount','invoice amount','net amount','bill amount']}
  ],
  pdc: [
    {k:'name',  label:'Customer name', req:1, kw:['acheadname','ac head name','party name','customer name','name']},
    {k:'amt',   label:'Cheque amount', req:1, kw:['amount','cheque amount','chq amount','amt']},
    {k:'date',  label:'Cheque date', kw:['date','cheque date','chq date']},
    {k:'no',    label:'Cheque no.', kw:['chqno','chq no','cheque no','cheque number']},
    {k:'bank',  label:'Bank (drawn on)', kw:['drawnon','drawn on','bank']},
    {k:'status',label:'Status', kw:['status','cheque status']}
  ],
  credit: [
    {k:'name',  label:'Customer name', req:1, kw:['name','party name','customer name','ledger name']},
    {k:'credit',label:'Credit days', req:1, kw:['credit days','credit period','cr days','credit','days']}
  ]
};
const SLOTS = [
  {k:'bal',   t:'1. Account Balance (PrintAccountBalance) <span class="req">*</span>', h:'Har customer ka ledger balance, agent group aur phone. Outstanding yahin se liya jaata hai, kyunki ERP mein bill-wise knock-off poora nahi hota.'},
  {k:'sales', t:'2. Sales Report <span class="req">*</span>', h:'Saare invoices date ke saath. Ledger balance ko FIFO se sabse naye bills par lagaya jaata hai (payment hamesha sabse purane bill mein adjust maana gaya hai), aur bacha hua balance hi ageing banata hai. Jitni purani history, utni sahi ageing.'},
  {k:'pdc',   t:'3. PDC', h:'Optional. Na daalein to pichhle upload ki PDC list chalegi. Cleared / realised hata diye jayenge, bounce wale alag dikhenge.'},
  {k:'credit',t:'4. Credit days list', h:'Optional. Customer name aur credit days wali koi bhi sheet. Na ho to neeche Data rules mein default credit days daal dein.'}
];

/* ============ helpers ============ */
const $ = (s,r=document)=>r.querySelector(s);
const esc = s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r0 = n=>Math.round(n||0);
function inr(n){ if(n==null||isNaN(n)) return '–'; const s=Math.round(Math.abs(n)).toLocaleString('en-IN'); return (n<0?'−':'')+'₹'+s; }
function inrS(n){ if(n==null||isNaN(n)) return '–'; const a=Math.abs(n), sg=n<0?'−':'';
  if(a>=1e7) return sg+'₹'+(a/1e7).toFixed(2)+' Cr'; if(a>=1e5) return sg+'₹'+(a/1e5).toFixed(2)+' L'; return inr(n); }
function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
const todayISO = ()=>iso(new Date());
function fromISO(s){ if(!s) return null; const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function addDays(s,n){ const d=fromISO(s); d.setDate(d.getDate()+n); return iso(d); }
function daysBetween(a,b){ return Math.round((fromISO(b)-fromISO(a))/DAY); }
function fmtD(s){ if(!s) return '–'; const d=fromISO(s); const o={day:'numeric',month:'short'}; if(d.getFullYear()!==new Date().getFullYear()) o.year='2-digit'; return d.toLocaleDateString('en-IN',o); }
function fmtDT(ms){ const d=new Date(ms); return d.toLocaleDateString('en-IN',{day:'numeric',month:'short'})+', '+d.toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit'}); }
const nkey = s=>String(s||'').toLowerCase().replace(/&/g,' and ').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,150);
function phoneDigits(p){ let d=String(p||'').replace(/\D/g,''); if(d.length>10 && d.startsWith('0')) d=d.replace(/^0+/,''); if(d.length===10) d='91'+d; return d.length>=11?d:''; }
function firstPhone(p){ return String(p||'').split(/[,\/;]| or /i)[0].trim(); }

function pnum(v){
  if(typeof v==='number') return isFinite(v)?v:null;
  let s=String(v??'').trim(); if(!s) return null;
  let neg=false;
  if(/\s*cr\.?$/i.test(s)){ neg=true; s=s.replace(/\s*cr\.?$/i,''); }
  else if(/\s*dr\.?$/i.test(s)){ s=s.replace(/\s*dr\.?$/i,''); }
  if(/^\(.*\)$/.test(s)){ neg=!neg; s=s.slice(1,-1); }
  s=s.replace(/rs\.?/gi,'').replace(/[₹,\s]/g,'');
  if(s.endsWith('-')){ neg=!neg; s=s.slice(0,-1); }
  if(s.startsWith('-')){ neg=!neg; s=s.slice(1); }
  if(!/^\d*\.?\d+$/.test(s)) return null;
  const n=parseFloat(s); return neg?-n:n;
}
const MON={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
function mk(y,mo,d){ const dt=new Date(y,mo,d); if(isNaN(dt)||dt.getMonth()!==mo) return null; return iso(dt); }
function pdate(v){
  if(v instanceof Date && !isNaN(v)) return iso(v);
  if(typeof v==='number'){ if(v>20000 && v<80000){ const d=new Date(Math.round((v-25569)*DAY)); return iso(new Date(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate())); } return null; }
  const s=String(v??'').trim(); if(!s) return null;
  let m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/); if(m) return mk(+m[1],+m[2]-1,+m[3]);
  m=s.match(/^(\d{1,2})[-\/.\s]([A-Za-z]{3,9}|\d{1,2})[-\/.\s,]+(\d{2,4})/);
  if(m){ const mo=/^\d+$/.test(m[2])?(+m[2]-1):MON[m[2].slice(0,3).toLowerCase()]; let y=+m[3]; if(y<100) y+=2000; if(mo==null) return null; return mk(y,mo,+m[1]); }
  if(/^\d{5}(\.\d+)?$/.test(s)) return pdate(+s);
  return null;
}
const bucketOf=a=>a<=15?0:a<=30?1:a<=60?2:a<=90?3:4;
function parseGroup(g){
  let s=String(g||'').trim().replace(/^agent\s+/i,'');
  const m=s.match(/^(.*?)[\s\-]*(\d{10})\s*$/);
  let name=(m?m[1]:s).replace(/[\s\-]+$/,'').trim().toLowerCase().replace(/\b[a-z]/g,c=>c.toUpperCase());
  const type=/^billing$/i.test(name)?'billing':/^bad\s*debt$/i.test(name)?'baddebt':'agent';
  return {name:name||'—',phone:m?m[2]:'',type};
}
function rng(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

/* ============ state ============ */
function defSettings(){ return {
  exclude:['Bijwasan Hub','Delhi Branch','Gurgaon Branch','Karol Bagh Branch','Dark Store G-1','Dark Store M-1'],
  agentMap:[['Seema Yadav','Ronak Sales']],
  defCredit:''
};}
const S = {
  real:{customers:[],meta:null,fu:{},days:{}}, demoData:null, demo:false,
  settings:defSettings(), backend:'none', loaded:false, readOnly:false,
  view:'dash', type:'agent', bk:null, plus:null, tw:null, trkTab:null, card:'all', q:'', agent:'', status:'', bucket:'', sort:{k:'due',d:-1}, open:null
};
const D = ()=>S.demo?S.demoData:S.real;
let db=null, user=null, uid=null, dl=null;

/* ============ processing ============ */
function buildCustomers(src, prev, settings, today, opts={}){
  const ex=(settings.exclude||[]).map(nkey).filter(Boolean);
  const isEx=n=>{ const k=nkey(n); return ex.some(e=>k===e||k.includes(e)); };
  const amap=new Map((settings.agentMap||[]).map(([a,b])=>[nkey(a),b]));
  const fixA=a=>{ a=String(a||'').trim(); return amap.get(nkey(a))||a; };
  const prevMap=new Map((prev||[]).map(c=>[c.k,c]));
  const defC=(settings.defCredit!==''&&settings.defCredit!=null)?+settings.defCredit:null;
  const INV=new Map(); let hist=null;
  for(const r of src.sales){ const k=nkey(r.name); if(!k) continue; if(!INV.has(k)) INV.set(k,[]); INV.get(k).push(r); if(!hist||r.date<hist) hist=r.date; }
  for(const l of INV.values()) l.sort((a,b)=>b.date.localeCompare(a.date));
  const ST=new Map(); for(const [k,l] of INV) ST.set(k,l.reduce((s,v)=>s+(v.amt>0?v.amt:0),0));
  const sameDay=!!opts.sameDay, hasPrev=!!(prev&&prev.length);
  const baseOf=p=>!p?null:(sameDay?{out:p.prevOut??null,st:p.prevSt??null,due:p.prevDue??null,age:p.prevAge??null,pdcs:p.prevPdcs||[]}:{out:p.out,st:p.st??null,due:p.due,age:p.age,pdcs:p.pdcs||[]});
  const pkey=x=>(x.no||'')+'|'+x.a;
  const histAge=hist?Math.max(0,daysBetween(hist,today)):999;
  const CR=new Map(); if(src.credit) for(const r of src.credit) CR.set(nkey(r.name),r.credit);
  let P=null;
  if(src.pdc){ P=new Map();
    for(const r of src.pdc){ if(!r.name||r.amt==null||r.amt<=0) continue;
      const st=String(r.status||'');
      if(/clear|realis|realiz|cancel|paid|honou?red/i.test(st)) continue;
      const k=nkey(r.name); if(!P.has(k)) P.set(k,[]);
      P.get(k).push({d:r.date||null,no:String(r.no||'').trim(),bank:String(r.bank||'').trim().slice(0,40),a:r0(r.amt),bounce:/bounc|return|dishon/i.test(st)?1:0});
    }
  }
  const custs=[], seen=new Set();
  for(const r of src.bal){
    if(!r.name||isEx(r.name)) continue;
    const k=nkey(r.name); if(!k||seen.has(k)) continue; seen.add(k);
    const bal=r.bal||0; if(Math.abs(bal)<1) continue;
    const grp=parseGroup(r.group), p=prevMap.get(k);
    const pend=[]; let rem=bal>0?bal:0;
    for(const v of (INV.get(k)||[])){ if(rem<0.5) break; if(!(v.amt>0)) continue; const t=Math.min(v.amt,rem); pend.push({d:v.date,r:v.ref,a:t,f:v.amt}); rem-=t; }
    pend.reverse();
    const b=[0,0,0,0,0]; let age=null;
    for(const v of pend){ const a=Math.max(0,daysBetween(v.d,today)); age=Math.max(age??0,a); b[bucketOf(a)]+=v.a; }
    let op=0;
    if(rem>=0.5){ op=rem; b[bucketOf(histAge)]+=rem; age=Math.max(age??0,histAge); }
    const cdays=CR.has(k)?CR.get(k):(r.credit!=null?r.credit:((!src.credit&&p&&p.cdays!=null)?p.cdays:defC));
    const list=P?(P.get(k)||[]):((p&&p.pdcs)||[]);
    const active=list.filter(x=>!x.bounce);
    const pdc=active.reduce((s,x)=>s+x.a,0);
    const ph=firstPhone(r.mobile)||firstPhone(r.phone);
    custs.push({
      k, name:String(r.name).trim(), phone:ph, phone2:(r.phone&&firstPhone(r.phone)!==ph)?firstPhone(r.phone):'', person:r.person||'', addr:String(r.addr||'').replace(/\s+/g,' ').trim(),
      agent:fixA(grp.name), agentPhone:grp.phone, type:grp.type, cdays,
      out:r0(bal), pdc:r0(pdc), due:r0(bal-pdc), age:bal>0?age:null, over:(bal>0&&age!=null&&cdays!=null)?age-cdays:null,
      b:b.map(r0), op:r0(op), opFrom:op?hist:null, n:pend.length,
      inv:pend.slice(0,12).map(v=>({d:v.d,r:String(v.r||'').slice(0,30),a:r0(v.a),f:r0(v.f)})),
      pdcs:list.slice(0,20), stuck:active.filter(x=>x.d && daysBetween(x.d,today)>3).length,
      nodate:active.filter(x=>!x.d).length, bounced:list.filter(x=>x.bounce).reduce((s,x)=>s+x.a,0),
      ...(()=>{ const bs=baseOf(p), st=r0(ST.get(k)||0);
        let paid=0, ns=0, isNew=false, pcl=0;

function derive(c, fu, today, meta){
  const logs=((fu&&fu.logs)||[]).map(normLog).sort((a,b)=>a.at-b.at);
  let ar=null, cr=null;
  for(let i=logs.length-1;i>=0;i--){ if(!ar&&logs[i].ar) ar=logs[i]; if(!cr&&logs[i].cr) cr=logs[i]; if(ar&&cr) break; }
  const last=logs.length?logs[logs.length-1]:null;
  const status=last?last.st:null, sub=last?last.ss:null;
  const next=fu&&fu.next||null;
  const agent=(fu&&fu.agent)||c.agent||'';
  let ptpState=null;
  if(fu&&fu.ptp&&sub==='Promise To Pay'){
    const paidEnough = c.due <= (fu.ptp.dueAt - fu.ptp.amount + 1);
    const uploadDay = meta&&meta.today;
    if(paidEnough) ptpState='kept';
    else if(today>fu.ptp.date && uploadDay && uploadDay>fu.ptp.date) ptpState='broken';
    else ptpState='open';
  }
  const active = c.due>0 && sub!=='Paid';
  return {
    c, fu, logs, status, sub, next, agent, ar, cr, ptpState, esc:(fu&&fu.esc)||null, escH:(fu&&fu.escHist)||[],
    visit:(fu&&fu.visit&&fu.visit.on)?fu.visit:null, cn:(fu&&fu.cn&&fu.cn.on)?fu.cn:null,
    cb:(last&&last.cb&&last.next===last.cb.slice(0,10))?last.cb:null,
    isToday: active && next && next<=today,
    isLate: active && next && next<today,
    notCalled: c.due>0 && !logs.length && (c.age||0) > (c.cdays??30),
    pdcWeek: (c.pdcs||[]).some(x=>!x.bounce && x.d && x.d>=today && x.d<=addDays(today,7)),
    chq: c.bounced>0 || c.stuck>0 || c.nodate>0

}

  const tr=`<div class="sec dsec"><h3>Payment trend <small>pichhle ${days.length||7} upload</small></h3>

function renderDelta(){

  const it=(card,n,l,a,cls='')=>`<button class="dl ${cls}" ${card?`data-card="${card}"`:'data-view="changes"'} aria-pressed="${S.card===card}"><b>${n}</b><span>${l}</span>${a!=null?`<em>${a}</em>`:''}</button>`;
  el.innerHTML=`<div class="dh">Pichhle upload (${fmtDT(m.prevAt)}) se ab tak</div><div class="dls">

    ${it(null,s.clearN,'Customers kam hue (poora clear)',inrS(s.clearAmt),'good')}
    ${it('down',s.downN,'Due kam hua',null,'')}
    ${it('up',s.upN,'Due badha',null,'')}
    ${it(null,inrS(s.sales),'Naya sale (in customers ko)',null,'')}
  </div>`;
}

}

function stripHTML(c){

  return `<div class="strip" title="${esc(title)}" aria-label="${esc(title)}">${c.b.map((v,i)=>`<i class="${v>0?'on':''}" style="--c:${BVARS[i]};${v>0?'opacity:'+(0.45+0.55*Math.min(1,v/tot*1.6)).toFixed(2):''}"></i>`).join('')}</div>`;
}
function chip(s){ return s?`<span class="chip" style="--c:${SCOL[s]||'#6B7588'}">${esc(s)}</span>`:'<span class="chip none">Status nahi</span>'; }
function trkLines(r){
  let h='';
  for(const kind of ['visit','cn']){
    const T=r[kind]; if(!T) continue;
    h+=`<span class="sub" style="color:var(--b3);font-weight:600">${TRK[kind].label}: ${trkLabel(kind,T.st)} (${Math.max(0,daysBetween(iso(new Date(T.at)),todayISO()))} din se)</span>`;
    if((kind==='visit'&&(S.card==='visit'||S.card==='visitp'))||(kind==='cn'&&(S.card==='cn'||S.card==='cnnew'))) h+=`<span class="tbtns" style="margin-top:4px">${trkBtnsHTML(r.c.k,kind,T.st)}</span>`;
  }
  return h;
}
function nextHTML(r){
  if(!r.next) return '<span class="muted">–</span>';
  const t=todayISO(), dd=daysBetween(t,r.next);
  const w=r.fu&&r.fu.with?`<span class="sub">${esc(r.fu.with)} se</span>`:'';
  const cbT=r.cb?`<span class="sub" style="color:var(--accent);font-weight:600">Call back ${new Date(r.cb).toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit'})}</span>`:'';
  if(dd<0) return `<span class="next late">${fmtD(r.next)}</span><span class="sub over">${-dd} din late</span>`+w+cbT;
  if(dd===0) return `<span class="next today">Aaj</span>`+w+cbT;
  if(dd===1) return `<span class="next">Kal</span>`+w+cbT;
  return `<span class="next">${fmtD(r.next)}</span>`+w+cbT;
}

function renderForm(r){
  const f=$('#logForm');
  if(S.readOnly && !S.demo){ f.innerHTML='<h3>Call log</h3><p class="muted" style="margin:0">Sirf dekhne ka access hai.</p>'; return; }
  const c=r.c, t=todayISO(), streak=naStreak(r.logs);
  const agents=[...new Set(D().customers.map(x=>x.agent).concat(Object.values(D().fu).map(x=>x.agent)).filter(Boolean))].sort();
  const defCB=()=>{ const d0=new Date(); d0.setDate(d0.getDate()+1); d0.setHours(11,0,0,0); return localDT(d0.getTime()); };
  f.innerHTML=`<h3>Naya call log</h3>
    <div class="field"><span>Call status</span><div class="statuses">${STATUSES.map((s,i)=>`<label><input type="radio" name="st" value="${s.v}" ${i===0?'required':''}><span style="--c:${s.c}">${s.v}</span></label>`).join('')}</div></div>
    <div class="field" id="ssBox" hidden><span>Sub status</span><div class="statuses" id="ssList"></div></div>
    <div class="warnbox" id="naWarn" hidden><b>Customer ${streak} baar se phone nahi utha raha.</b> Aap phir bhi Not Answer save kar sakte ho, ya <button class="btn small" type="button" id="naToNr">Not Responded mark karein</button> (Visit Req lag jayega).</div>
    <div class="rgrid" id="cbBox" hidden><label class="field"><span>Call back kab (date aur time)</span><input type="datetime-local" name="cb" min="${localDT(Date.now())}"></label><span></span></div>
    <div class="field"><span>Follow-up kisse lena hai</span><div class="seg">${WITHS.map((w,i)=>`<label><input type="radio" name="with" value="${w}" ${(r.fu&&r.fu.with?r.fu.with===w:i===0)?'checked':''}><span>${w}</span></label>`).join('')}</div></div>
    <div class="rgrid">
      <label class="field"><span>Agent remark</span><textarea name="ar" placeholder="Agent ne kya bataya"></textarea><div class="qchips" data-for="ar">${QA.map(q=>`<button type="button">${q}</button>`).join('')}</div></label>
      <label class="field"><span>Customer remark</span><textarea name="cr" placeholder="Customer ne kya bola"></textarea><div class="qchips" data-for="cr">${QC.map(q=>`<button type="button">${q}</button>`).join('')}</div></label>
    </div>
    <div class="rgrid" id="ptpBox" hidden>
      <label class="field"><span>Promise date</span><input type="date" name="pd" min="${t}"></label>
      <label class="field"><span>Promise amount</span><input type="number" name="pa" min="1" step="1" value="${Math.max(0,c.due)}"></label>
    </div>
    <div class="rgrid">
      <label class="field"><span>Baat kab hui</span><input type="datetime-local" name="when" value="${localDT(Date.now())}" max="${localDT(Date.now()+6e4)}"></label>
      <span></span>
    </div>
    <div class="rgrid">
      <div><label class="field"><span>Next follow-up date</span><input type="date" name="next"></label>
        <div class="qchips nxq"><button type="button" data-d="1">Kal</button><button type="button" data-d="2">+2 din</button><button type="button" data-d="3">+3 din</button><button type="button" data-d="5">+5 din</button><button type="button" data-d="7">+7 din</button><button type="button" data-d="15">+15 din</button></div>
        <span class="nxl" id="nxl" aria-live="polite"></span></div>
      <label class="field"><span>Agent (badalna ho to)</span><input name="agent" list="agentList" value="${esc((r.fu&&r.fu.agent)||'')}" placeholder="${esc(c.agent||'Agent ka naam')}"><datalist id="agentList">${agents.map(a=>`<option value="${esc(a)}">`).join('')}</datalist></label>
    </div>
    <div class="savebar"><button class="btn" type="submit" value="save">Save karein</button><button class="btn primary" type="submit" value="next">Save karke agla customer</button></div>
    <p class="mp" style="margin:8px 0 0;text-align:right">Shortcut: Ctrl+Enter = save + agla customer &nbsp;·&nbsp; J / K = agla / pichla &nbsp;·&nbsp; Esc = band</p>`;
  const selSt=()=>{ const x=f.querySelector('input[name=st]:checked'); return x?x.value:''; };
  const selSs=()=>{ const x=f.querySelector('input[name=ss]:checked'); return x?x.value:''; };
  const updNx=()=>{ const el=f.querySelector('#nxl'); if(!el) return; const v=f.next.value; if(!v){ el.textContent=''; return; } const n=daysBetween(todayISO(),v); el.textContent=fromISO(v).toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'short'})+' ('+(n===0?'aaj':n===1?'kal':n>0?n+' din baad':(-n)+' din pehle')+')'; };
  const applyRule=()=>{
    const st=selSt(), ss=selSs();
    $('#naWarn').hidden=!(st==='Not Answer'&&streak>=4);
    const isCB=ss==='Call Back', isP=ss==='Promise To Pay';
    $('#cbBox').hidden=!isCB; f.cb.required=isCB; if(isCB&&!f.cb.value) f.cb.value=defCB();
    $('#ptpBox').hidden=!isP; f.pd.required=isP; f.pa.required=isP;
    if(ss){
      const rule=subRule(st,ss);
      const w=f.querySelector(`input[name="with"][value="${rule.w}"]`); if(w) w.checked=true;
      if(rule.n==='') f.next.value=''; else if(rule.n!=null) f.next.value=addDays(todayISO(),rule.n);
      if(isCB&&f.cb.value) f.next.value=f.cb.value.slice(0,10);
      if(isP&&f.pd.value) f.next.value=f.pd.value;
    }
    updNx();
  };
  const drawSubs=st=>{
    const s=STATUSES.find(x=>x.v===st), box=$('#ssBox');
    if(!s){ box.hidden=true; return; }
    $('#ssList').innerHTML=s.subs.map(sub=>`<label><input type="radio" name="ss" value="${esc(sub)}" required><span style="--c:${s.c}">${esc(sub)}</span></label>`).join('');
    box.hidden=false;
    if(s.subs.length===1) f.querySelector('input[name=ss]').checked=true;
    applyRule();
  };
  f.oninput=e=>{ if(e.target.name==='next') updNx(); };
  f.onclick=e=>{ if(e.target.closest('#naToNr')){ const x=f.querySelector('input[name=st][value="Not Responded"]'); x.checked=true; drawSubs('Not Responded'); } };
  f.querySelectorAll('.qchips').forEach(box=>box.onclick=e=>{ const b=e.target.closest('button'); if(!b) return; if(b.dataset.d!=null){ f.next.value=addDays(todayISO(),+b.dataset.d); updNx(); return; } const ta=f[box.dataset.for]; ta.value=(ta.value.trim()?ta.value.trim()+'. ':'')+b.textContent; ta.focus(); });
  f.onchange=e=>{
    const n=e.target.name;
    if(n==='st') drawSubs(e.target.value);
    else if(n==='ss') applyRule();
    else if(n==='cb'){ if(e.target.value) f.next.value=e.target.value.slice(0,10); updNx(); }
    else if(n==='pd'){ if(e.target.value) f.next.value=e.target.value; updNx(); }
    else updNx();
  };
  f.onsubmit=async e=>{
    e.preventDefault();
    const st=selSt(), ss=selSs();
    if(!st){ toast('Pehle call status chunein'); return; }
    if(!ss){ toast('Sub status chunein'); return; }
    const w=f.when.value?new Date(f.when.value).getTime():Date.now();
    const entry={at:isNaN(w)?Date.now():Math.min(w,Date.now()), sv:Date.now(), by:uid||null, st, ss, with:f.with.value, ar:f.ar.value.trim(), cr:f.cr.value.trim(), next:f.next.value||null, dueAt:r.c.due};
    const goNext=e.submitter&&e.submitter.value==='next';
    if(ss==='Call Back'){ if(!f.cb.value){ toast('Call back ki date aur time bharein'); return; } entry.cb=f.cb.value; entry.next=f.cb.value.slice(0,10); }
    if(ss==='Promise To Pay'){ entry.pd=f.pd.value; entry.pa=+f.pa.value||0; if(!entry.pd||!entry.pa){ toast('Promise date aur amount bharein'); return; } }
    const btns=f.querySelectorAll('button[type=submit]'); btns.forEach(b=>b.disabled=true);
    try{
      await saveLog(r.c, entry, f.agent.value.trim()); toast('Update save ho gaya – '+fmtDT(entry.at));
      if(goNext){ const L=S.lastList||[], i=L.indexOf(r.c.k); const nk=L[i+1]; if(nk){ openDrawer(nk); return; } toast('List ka aakhri customer tha'); }
      const rr=curRow()||r; renderForm(rr); renderTrk(rr);
    }catch(err){ toast('Save nahi hua: '+(err&&err.code||err&&err.message||'error')); btns.forEach(b=>b.disabled=false); }
  };
}
async function renderTimeline(r){
  const ul=$('#dTimeline');
  if(!r.logs.length){ ul.innerHTML='<li style="border:0;padding-left:0" class="muted none">Is customer se abhi tak koi follow-up log nahi hua.</li>'; return; }
  const logs=r.logs.slice().sort((a,b)=>b.at-a.at);
  let names={};
  const ids=[...new Set(logs.map(l=>l.by).filter(Boolean))];
  if(user&&ids.length){ try{ const ps=await user.profiles(ids); for(const id of ids) names[id]=ps[id]&&ps[id].name||''; }catch(e){} }
  if(S.open!==r.c.k) return;
  const canDel=l=>!S.readOnly&&(S.demo||!db||!l.by||l.by===uid);
  ul.innerHTML=logs.map((l,i)=>`<li style="--c:${SCOL[l.st]||'#6B7588'}">
    <div class="when">Baat hui: <b style="color:var(--ink)">${fmtDT(l.at)}</b>${names[l.by]?' – '+esc(names[l.by]):''}${l.sv&&Math.abs(l.sv-l.at)>30*6e4?` <span title="Entry kab likhi gayi">(likha ${fmtDT(l.sv)})</span>`:''}${i===0&&canDel(l)?`<button class="del" data-dellog="${l.at}">Galat hai, hatayein</button>`:''}</div>
    <div style="margin-top:3px">${chip(l.st)} ${l.ss&&l.ss!==l.st?`<b style="font-size:12.5px">${esc(l.ss)}</b> · `:''}<span class="muted" style="font-size:12.5px">${esc(l.with||'')} se${l.next?' – next '+fmtD(l.next):''}</span></div>
    ${l.cb?`<div class="r">Call back: <b style="color:var(--ink);font-size:13px">${fmtDT(new Date(l.cb).getTime())}</b></div>`:''}
    ${l.ss==='Promise To Pay'&&l.pd?`<div class="r">Promise: <b style="color:var(--ink);font-size:13px">${inr(l.pa)}</b> – ${fmtD(l.pd)}</div>`:''}
    ${l.ar?`<div class="r"><b>Agent remark:</b> ${esc(l.ar)}</div>`:''}
    ${l.cr?`<div class="r"><b>Customer remark:</b> ${esc(l.cr)}</div>`:''}
  </li>`).join('');
}

/* ============ storage ============ */
function clone(o){ return JSON.parse(JSON.stringify(o||{})); }
function docFromLogs(c, logs, agent, base){
  logs=logs.slice().sort((a,b)=>a.at-b.at).slice(-150);
  const l=logs.length?normLog(logs[logs.length-1]):null;
  return { name:c.name, status:l?l.st:null, sub:l?l.ss:null, with:l?l.with:null, next:l?l.next:null,
    ptp: l&&l.ss==='Promise To Pay'?{date:l.pd, amount:l.pa, dueAt:l.dueAt??c.due, at:l.at}:null,
    agent: agent||null, logs, updatedAt:Date.now(),
    esc:(base&&base.esc)||null, escHist:(base&&base.escHist)||[], visit:(base&&base.visit)||null, cn:(base&&base.cn)||null };
}
async function putFu(c, doc){
  const d=D();
  if(S.demo){ d.fu[c.k]=doc; render(); return; }
  if(db){ await db.doc('followups/'+c.k).set(doc); return; }
  d.fu[c.k]=doc; localSave(); render();
}
async function saveLog(c, entry, agentOverride){
  const cur=clone(D().fu[c.k]);
  const doc=docFromLogs(c,(cur.logs||[]).concat([entry]), agentOverride||cur.agent, cur);
  const now=entry.sv||Date.now();
  const openT=kind=>{ const T=doc[kind]; if(T&&T.on) return;
    doc[kind]={on:true, st:kind==='visit'?'pending':'new', at:now, srcAt:entry.at, src:entry.st+' – '+entry.ss, upAt:now,
      hist:((T&&T.hist)||[]).concat([{at:now,st:'open',note:entry.st+' – '+entry.ss,by:uid||null}]).slice(-30)}; };
  if((entry.st==='Connected'&&entry.ss==='Visit Raise')||(entry.st==='Not Responded'&&entry.ss==='Visit Req')) openT('visit');
  if(entry.st==='Connected'&&entry.ss==='Credit Note') openT('cn');
  await putFu(c, doc);
  if(!S.demo) D().fu[c.k]=doc;
}
async function saveEsc(c, act, data){
  const cur=clone(D().fu[c.k]); const now=Date.now(); const hist=(cur.escHist||[]).slice(); let E=cur.esc||null;
  if(act==='raise'){ E={at:now,to:data.to,reason:data.reason,upd:data.upd||null,by:uid||null}; hist.push({at:now,act:'raise',to:data.to,reason:data.reason,upd:data.upd||null,by:uid||null}); }
  else if(act==='note'){ hist.push({at:now,act:'note',note:data.note,by:uid||null}); }
  else if(act==='resolve'){ hist.push({at:now,act:'resolve',note:data.note||'',by:uid||null}); E=null; }
  const doc={...docFromLogs(c,cur.logs||[],cur.agent,cur), esc:E, escHist:hist.slice(-60)};
  await putFu(c, doc);
  if(!S.demo) D().fu[c.k]=doc;
}
async function escDone(k){
  if(S.readOnly&&!S.demo){ toast('Sirf dekhne ka access hai'); return; }
  const d=D(); const c=d.customers.find(x=>x.k===k)||{k,name:(d.fu[k]&&d.fu[k].name)||k,due:0};
  const note=prompt('Update / resolution note likhein (khali chhod sakte hain).\nOK dabate hi escalation hat jayega:'); if(note===null) return;
  try{ await saveEsc(c,'resolve',{note:note.trim()}); toast('Escalation hata diya'); if(S.open===k) renderEsc(curRow()); render(); }
  catch(err){ toast('Nahi hua: '+(err.code||err.message)); }
}
async function saveTrk(c, kind, st, note){
  const cur=clone(D().fu[c.k]); const T=cur[kind]; if(!T) return; const now=Date.now();
  T.st=st; T.on=st!=='done'; T.upAt=now;
  T.hist=(T.hist||[]).concat([{at:now,st,note:note||'',by:uid||null}]).slice(-30);
  const doc={...docFromLogs(c,cur.logs||[],cur.agent,cur), [kind]:T};
  await putFu(c, doc);
  if(!S.demo) D().fu[c.k]=doc;
}
async function trkMove(k,kind,st){
  if(S.readOnly&&!S.demo){ toast('Sirf dekhne ka access hai'); return; }
  const d=D(); const c=d.customers.find(x=>x.k===k)||{k,name:(d.fu[k]&&d.fu[k].name)||k,due:0};
  let note='';
  if(st==='done'){ const n=prompt('Note likhein (khali chhod sakte hain).\n'+TRK[kind].label+' band karne ke liye OK dabayein:'); if(n===null) return; note=n.trim(); }
  try{ await saveTrk(c,kind,st,note); toast(TRK[kind].label+': '+trkLabel(kind,st)); if(S.open===k) renderTrk(curRow()); render(); }
  catch(err){ toast('Nahi hua: '+(err.code||err.message)); }
}
async function deleteLog(c, at){
  const cur=clone(D().fu[c.k]); const logs=(cur.logs||[]).filter(l=>String(l.at)!==String(at));
  const doc=docFromLogs(c, logs, cur.agent, cur);
  for(const kind of ['visit','cn']){ const T=doc[kind]; if(T&&String(T.srcAt)===String(at)&&T.on&&(T.hist||[]).length<=1) doc[kind]=null; }
  await putFu(c, doc);
  if(!S.demo) D().fu[c.k]=doc;
}
async function saveSnapshot(custs, meta){
  if(db){
    const chunks=[]; let cur=[], size=0;
    for(const c of custs){ const s=JSON.stringify(c).length; if(size+s>170000 && cur.length){ chunks.push(cur); cur=[]; size=0; } cur.push(c); size+=s; }
    if(cur.length) chunks.push(cur);
    const old=(S.real.meta&&S.real.meta.chunks)||0;
    for(let i=0;i<chunks.length;i++) await db.doc('snap/c'+i).set({i, customers:chunks[i]});
    meta.chunks=chunks.length;
    await db.doc('meta/current').set(meta);
    for(let i=chunks.length;i<old;i++){ try{ await db.doc('snap/c'+i).delete(); }catch(e){} }
  } else {
    S.real.customers=custs; S.real.meta=meta; localSave(); render();
  }
}
async function saveSettings(){
  if(db){ try{ await db.doc('meta/settings').set(clone(S.settings)); }catch(e){} }
  else localSave();
}
function localSave(){
  try{ localStorage.setItem('cdesk', JSON.stringify({customers:S.real.customers, meta:S.real.meta, fu:S.real.fu, days:S.real.days, settings:S.settings})); }
  catch(e){ toast('Browser storage full hai – data sirf is session tak rahega'); }
}
function localLoad(){
  try{ const j=JSON.parse(localStorage.getItem('cdesk')||'null'); if(j){ S.real.customers=j.customers||[]; S.real.meta=j.meta||null; S.real.fu=j.fu||{}; S.real.days=j.days||{}; if(j.settings) S.settings={...defSettings(),...j.settings}; } }catch(e){}
}
function subscribe(){
  db.doc('meta/current').onSnapshot(async snap=>{
    const m=snap.exists?snap.data():null;
    if(!m){ S.real.meta=null; S.real.customers=[]; S.loaded=true; render(); return; }
    if(S.real.meta && S.real.meta.ver===m.ver && S.real.customers.length){ return; }
    try{
      const parts=await Promise.all(Array.from({length:m.chunks||0},(_,i)=>db.doc('snap/c'+i).get()));
      const cs=[]; parts.forEach(p=>{ if(p.exists) cs.push(...(p.data().customers||[])); });
      S.real.meta=m; S.real.customers=cs;
    }catch(e){ toast('Data load nahi hua – page reload karein'); }
    S.loaded=true; render();
  }, e=>{ S.loaded=true; toast('Data load nahi hua ('+e.code+')'); render(); });
  db.collection('followups').onSnapshot(snap=>{
    const fu={}; snap.docs.forEach(d=>{ fu[d.id]=d.data(); }); S.real.fu=fu; render();
  }, e=>toast('Follow-ups load nahi hue ('+e.code+')'));
  db.collection('days').onSnapshot(snap=>{ const ds={}; snap.docs.forEach(d=>{ ds[d.id]=d.data(); }); S.real.days=ds; render(); }, ()=>{});
  db.doc('meta/settings').get().then(s=>{ if(s.exists) S.settings={...defSettings(),...s.data()}; }).catch(()=>{});
}

const UP={bal:null,sales:null,pdc:null,credit:null};

  const sx=S.settings;
  $('#upBody').innerHTML=`

      <label class="field"><span>Agent naam badlein (purana => naya, ek line mein ek)</span><textarea id="setAm" rows="2">${esc(sx.agentMap.map(x=>x.join(' => ')).join('\n'))}</textarea></label>
      <label class="field" style="max-width:260px"><span>Default credit days (jinke liye credit days list nahi hai)</span><input id="setCd" type="number" min="0" value="${esc(sx.defCredit)}" placeholder="Khali chhod sakte hain"></label>
    </details>`;

function slotHTML(k,title,help){
  return `<div class="fslot"><h3>${title}</h3><p class="h">${help}</p>
    <input type="file" id="file-${k}" accept=".xlsx,.xls,.csv">
    <div class="st" id="st-${k}"></div><div class="map" id="map-${k}"></div></div>`;
}
function closeUpload(){ $('#upModal').classList.remove('on'); }
async function readFile(k,file){
  const st=$('#st-'+k); $('#map-'+k).innerHTML='';
  if(!file){ UP[k]=null; checkReady(); return; }
  if(!window.XLSX){ st.className='st err'; st.textContent='Excel reader load nahi hua. Internet check karke page reload karein.'; return; }
  st.className='st'; st.textContent='Padh rahe hain…';
  try{
    let wb;
    if(/\.csv$/i.test(file.name)) wb=XLSX.read(await file.text(),{type:'string',raw:true});
    else wb=XLSX.read(await file.arrayBuffer(),{type:'array'});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''});
    const hr=findHeader(rows,FIELDS[k]);
    const headers=(rows[hr]||[]).map((h,i)=>String(h||'').trim()||('Column '+(i+1)));
    const map=autoMap(headers,FIELDS[k]);
    UP[k]={file:file.name,rows,hr,headers,map};
    st.className='st ok'; st.textContent=`${file.name}: ${rows.length-hr-1} rows mile (header row ${hr+1}). Neeche columns check kar lein.`;
    renderMap(k);
  }catch(e){ st.className='st err'; st.textContent='File padh nahi paye: '+e.message; UP[k]=null; }
  checkReady();
}
function findHeader(rows,fields){
  let best=0,bs=-1;
  for(let r=0;r<Math.min(25,rows.length);r++){
    const cells=rows[r].map(x=>String(x||'').toLowerCase().trim());
    let s=0; for(const f of fields) if(cells.some(c=>c&&f.kw.some(k=>c===k||c.includes(k)))) s++;
    if(s>bs){ bs=s; best=r; }
  }
  return best;
}
function autoMap(headers,fields){
  const H=headers.map(h=>h.toLowerCase().replace(/\s+/g,' ').trim());
  const cand=[];
  fields.forEach(f=>f.kw.forEach((k,ki)=>H.forEach((h,ci)=>{ if(h===k) cand.push([f.k,ci,200-ki]); else if(h.includes(k)) cand.push([f.k,ci,100-ki-(h.length-k.length)*0.5]); })));
  cand.sort((a,b)=>b[2]-a[2]);
  const map={}, used=new Set();
  for(const [fk,ci] of cand){ if(fk in map||used.has(ci)) continue; map[fk]=ci; used.add(ci); }
  return map;
}
function renderMap(k){
  const u=UP[k];
  $('#map-'+k).innerHTML=FIELDS[k].map(f=>`<label>${f.label}${f.req?' <span class="req">*</span>':''}
    <select data-k="${k}" data-f="${f.k}"><option value="">– nahi hai –</option>${u.headers.map((h,i)=>`<option value="${i}" ${u.map[f.k]===i?'selected':''}>${esc(h)}</option>`).join('')}</select></label>`).join('');
  $('#map-'+k).onchange=e=>{ const s=e.target; if(s.dataset.f){ if(s.value==='') delete u.map[s.dataset.f]; else u.map[s.dataset.f]=+s.value; checkReady(); } };
}
function checkReady(){
  const ok=k=>!UP[k]||FIELDS[k].every(f=>!f.req||f.k in UP[k].map);
  $('#upGo').disabled=!(UP.bal && UP.sales && SLOTS.every(s=>ok(s.k)));

function extract(k){
  const u=UP[k]; if(!u) return null;
  const m=u.map, g=(row,f)=>f in m?row[m[f]]:'';
  const out=[];
  for(const row of u.rows.slice(u.hr+1)){
    const name=String(g(row,'name')||'').trim();
    if(!name||/^(grand\s*total|total|sub\s*total)\b/i.test(name)) continue;
    if(k==='bal'){ const cd=pnum(g(row,'credit')); out.push({name,bal:pnum(g(row,'bal'))||0,group:String(g(row,'group')||''),mobile:String(g(row,'mobile')||'').trim(),phone:String(g(row,'phone')||'').trim(),person:String(g(row,'person')||'').trim(),addr:String(g(row,'addr')||'').trim(),credit:cd!=null?Math.round(cd):null}); }
    else if(k==='sales'){ const a=pnum(g(row,'amt')), d=pdate(g(row,'date')); if(a==null||!d) continue; out.push({name,date:d,ref:String(g(row,'ref')||'').trim(),amt:a}); }
    else if(k==='pdc'){ out.push({name,amt:pnum(g(row,'amt')),date:pdate(g(row,'date')),no:String(g(row,'no')||'').trim(),bank:String(g(row,'bank')||'').trim(),status:String(g(row,'status')||'')}); }
    else { const cd=pnum(g(row,'credit')); if(cd!=null) out.push({name,credit:Math.round(cd)}); }
  }
  return out;
}
async function processUpload(){

    const typing=/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
    if(!typing && !e.ctrlKey && !e.metaKey && !e.altKey && (e.key==='j'||e.key==='k')){ const L=S.lastList||[], i=L.indexOf(S.open), nk=L[i+(e.key==='j'?1:-1)]; if(nk){ e.preventDefault(); openDrawer(nk); } }
    if(e.key==='Enter' && (e.ctrlKey||e.metaKey)){ const fm=$('#logForm'), b=fm&&fm.querySelector('button[value=next]'); if(b&&!b.disabled){ e.preventDefault(); fm.requestSubmit(b); } }
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='fq'){ S.q=e.target.value; render(); }
});
document.addEventListener('change',e=>{
  if(e.target.id==='fagent'){ S.agent=e.target.value; render(); }
  if(e.target.id==='fstatus'){ S.status=e.target.value; render(); }
  if(e.target.id==='fbucket'){ S.bucket=e.target.value; render(); }
  if(e.target.name==='acctype'){ S.type=e.target.value; S.agent=''; render(); }
});
$('#scrim').onclick=closeDrawer; $('#dClose').onclick=closeDrawer;
try{ if(localStorage.getItem('cdense')){ S.dense=true; document.body.classList.add('dense'); } }catch(e){}
$('#upClose').onclick=closeUpload; $('#upCancel').onclick=closeUpload; $('#upGo').onclick=processUpload;

/* ============ boot ============ */
render();
(async function boot(){
  const C=window.claude;
  if(!C||typeof C.use!=='function'){ S.backend='local'; localLoad(); S.loaded=true; render(); return; }
  let d=null;
  try{ [d,user,dl]=await Promise.all([C.use('db'),C.use('user'),C.use('downloads')]); }catch(e){}
  if(d){
    db=d; S.backend='db';
    if(user){ try{ uid=await user.id(); }catch(e){} try{ const can=await user.can('data.write'); if(can===false) S.readOnly=true; }catch(e){} }
    subscribe();
  } else { S.backend='local'; localLoad(); S.loaded=true; }
  render();
})();
</script>
</body>
</html>
